# File: core/templates/nginx_vhost.j2

server {
    listen 80;

    server_name how_to_use_PyQt5.test;
    root D:\WorkSpace\Python\how_to_use_PyQt5;

    index index.php index.html index.htm;

    # Cấu hình logs
    access_log D:/WorkSpace/Python/LocalWebServerStacks/core/services/webservers/bin/nginx/nginx-1.28.0/logs;
    error_log D:/WorkSpace/Python/LocalWebServerStacks/core/services/webservers/bin/nginx/nginx-1.28.0/logs;



    # ---- Dành cho dự án Proxy (Node, Python, v.v.) ----
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }


    # Chặn truy cập file .ht
    location ~ /\.ht {
        deny all;
    }
}

